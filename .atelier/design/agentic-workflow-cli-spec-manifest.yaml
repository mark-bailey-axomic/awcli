  # A CLI has no HTTP surface; `api` records command entry points, and exit codes
  # play the role of status codes (BR-018).
  api:
    # Implemented by AWCLI-00. Listed because the manifest should describe the surface
    # that exists, not only the surface that is planned.
    - endpoint: version
      method: CLI
      path: awcli --version
      request: ""
      response: "installed version on stdout"
      status_codes: [0]
    - endpoint: help
      method: CLI
      path: awcli --help
      request: ""
      response: "usage on stdout"
      status_codes: [0]
    - endpoint: run
      method: CLI
      path: awcli run <name-or-path>
      request: "--repo --iterations --max-duration --name --fresh --dry-run --arg k=v --reset-state"
      response: "run outcome + summary"
      status_codes: [0, 1, 2, 3]
    - endpoint: create
      method: CLI
      path: awcli create <name>
      request: "--project --template"
      response: "scaffolded workflow path"
      status_codes: [0, 3]
    - endpoint: init
      method: CLI
      path: awcli init
      request: ""
      response: ".awcli/ written"
      status_codes: [0, 3]
    - endpoint: clean
      method: CLI
      path: awcli clean
      request: "--run --branches"
      response: "released locks, collected branches"
      status_codes: [0]
    - endpoint: doctor
      method: CLI
      path: awcli doctor
      request: ""
      response: "versions, ranges, image and git state"
      status_codes: [0]
  services:
    - class: AgentDriver
      methods:
        - name: start
          params: "prompt, target, opts"
          returns: AgentHandle
        - name: output
          params: ""
          returns: "AsyncIterable<string>"
        - name: wait
          params: ""
          returns: "Promise<Exit>"
        - name: kill
          params: ""
          returns: "Promise<void>"
    - class: ExecTarget
      methods:
        - name: exec
          params: "cmd, opts"
          returns: "Promise<ExecResult>"
        - name: available
          params: ""
          returns: "Promise<boolean>"
        - name: dispose
          params: ""
          returns: "Promise<void>"
    - class: Workspace
      methods:
        - name: acquire
          params: "run, slot"
          returns: "Promise<WorkspaceHandle>"
        - name: release
          params: "preserve: true"
          returns: "Promise<void>"
    - class: Clock
      methods:
        - name: now
          params: ""
          returns: Instant
        - name: elapsed
          params: since
          returns: Duration
        - name: deadline
          params: duration
          returns: Deadline
  repositories:
    - class: Store
      methods:
        - name: loadState
          params: run
          returns: "Promise<State>"
        - name: saveState
          params: "run, data"
          returns: "Promise<void>  # temp+rename, never partially observable"
        - name: appendRecord
          params: "run, entry"
          returns: "Promise<void>  # stamps awcli + agent version, HEAD"
        - name: acquireLock
          params: run
          returns: "Promise<Lock>  # fails if held by a live owner"
        - name: reclaimIfStale
          params: run
          returns: "Promise<boolean>  # only when the owner is gone"
        - name: logStream
          params: "run, agent"
          returns: WritableStream

