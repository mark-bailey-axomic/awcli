name: ci

on:
  push:
    branches: [main]
  pull_request:

# macOS and Linux only. Native Windows is refused at startup and WSL2 is the supported
# Windows path (ADR-0007), so a windows-latest job could only ever assert the refusal —
# and would drag in the four subsystems that ADR names as the cost of supporting it.
jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  global-install:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The premise of the tool: it works from a global install, not from this checkout.
      - run: npm run verify:global
